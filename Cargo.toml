[package]
name = "dtg-credentials"
description = "Decentralized Trust Graph (DTG) Credentials Library"
version = "0.15.0"
edition = "2024"
publish = true
authors = ["Glenn Gore <glenn@affinidi.com>"]
rust-version = "1.95.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/dtg-credentials"

[features]
default = ["affinidi-signing"]
affinidi-signing = ["dep:affinidi-secrets-resolver"]
# DTG credential context v3: every credential carries a 32-byte `salt` (DTG Core
# Credentials, *Salting*). OFF by default: the registry has not yet published
# `contexts/v3.jsonld`, and until its digest is recorded the specification says issuers
# MUST NOT emit `salt`. Enable it on verifiers before any issuer.
context-v3 = ["dep:rand"]

[dependencies]
affinidi-data-integrity = "0.9"
# did:scid parties compare by DID, ignoring a `?src=` locator
# (`scid::same_reference`, 0.4.4). Already in the graph through
# affinidi-data-integrity.
affinidi-did-common = { version = "0.5", default-features = false }
affinidi-secrets-resolver = { version = "0.6", optional = true }

chrono = "0.4"
multibase = "0.9"
# Draws the `context-v3` salt. Already in the dependency graph (through the affinidi
# crates), so the feature adds no new crate.
rand = { version = "0.10", optional = true }
serde = "1.0"
serde_json = "1.0"
serde_json_canonicalizer = "0.4"
sha2 = "0.11"
thiserror = "2.0"
tracing = "0.1"
# NFC check on VSC predicate IRIs, which are compared byte for byte and never normalized.
unicode-normalization = "0.1"

[dev-dependencies]
affinidi-tdk = "0.49"
anyhow = "1.0"
tokio = "1"
# The `data_room` example seals records for real rather than pretending to. Dev-only:
# nothing in the library itself encrypts, and adding a cipher to its dependency graph for
# the sake of an example would be the wrong trade.
chacha20poly1305 = "0.11"
rand = "0.10"

# Both examples sign, and signing lives behind `affinidi-signing`. Without this
# a `--no-default-features` build fails on the examples while the library it is
# meant to be testing compiles perfectly - the failure names `.sign()`, not the
# feature, so it reads as a missing method rather than a disabled backend.
[[example]]
name = "sign_and_verify"
required-features = ["affinidi-signing"]

[[example]]
name = "data_room"
required-features = ["affinidi-signing"]

