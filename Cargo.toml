[package]
name = "dtg-credentials"
description = "Decentralized Trust Graph (DTG) Credentials Library"
version = "0.6.0"
edition = "2024"
publish = true
authors = ["Glenn Gore <glenn@affinidi.com>"]
rust-version = "1.95.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/dtg-credentials"

[features]
default = ["affinidi-signing"]
affinidi-signing = ["dep:affinidi-secrets-resolver"]

[dependencies]
affinidi-data-integrity = "0.7"
affinidi-secrets-resolver = { version = "0.5", optional = true }

chrono = "0.4"
multibase = "0.9"
serde = "1.0"
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
affinidi-tdk = "0.10"
anyhow = "1.0"
tokio = "1"
# The `data_room` example seals records for real rather than pretending to. Dev-only:
# nothing in the library itself encrypts, and adding a cipher to its dependency graph for
# the sake of an example would be the wrong trade.
chacha20poly1305 = "0.10"
rand = "0.8"

# Both examples sign, and signing lives behind `affinidi-signing`. Without this
# a `--no-default-features` build fails on the examples while the library it is
# meant to be testing compiles perfectly - the failure names `.sign()`, not the
# feature, so it reads as a missing method rather than a disabled backend.
[[example]]
name = "sign_and_verify"
required-features = ["affinidi-signing"]

[[example]]
name = "data_room"
required-features = ["affinidi-signing"]
